<app-header />
<main>
  <ul id="users">
    @for (user of users; track user.id) {
      <li>
        <app-user
          [user]="user"
          (select)="onSelectUser($event)"
          [selected]="user.id === userId"
        />
      </li>
    }
  </ul>
  @if (selectedUserName) {
    <app-tasks [name]="selectedUserName" [userId]="userId" />
  } @else {
    <p id="fallback">Select a user to see their tasks!</p>
  }
</main>
